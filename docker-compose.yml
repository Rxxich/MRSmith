# MRSmith. Put this file and .env into one folder (e.g. /opt/mrsmith), then:
#   docker compose up -d
# The panel listens on 127.0.0.1:8090 only; put a reverse proxy with HTTPS in
# front of it (see examples/ in the repository).
services:
  mrsmith:
    image: ghcr.io/rxxich/mrsmith:latest
    container_name: mrsmith
    hostname: mrsmith
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - mrsmith-data:/data
      # Backups: the panel writes archives here and restores from them.
      - ./backup:/backup
    depends_on:
      backup-folder:
        condition: service_completed_successfully
    # Lets MRSMITH_GITHUB_PROXY / TELEGRAM_PROXY point at a proxy on this server.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Runs once before the panel and lets it write into ./backup (the panel
  # itself works as an unprivileged user). Then it exits.
  backup-folder:
    image: ghcr.io/rxxich/mrsmith:latest
    command: ["prepare-backup-dir", "/backup"]
    user: "0:0"
    volumes:
      - ./backup:/backup
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
    restart: "no"

volumes:
  mrsmith-data:
    name: mrsmith-data
