# nginx in front of MRSmith on the same server.
# MRSmith publishes itself on 127.0.0.1:8090 (see docker-compose.yml).
# Replace rules.example.com and the certificate paths, e.g. after
#   certbot certonly --nginx -d rules.example.com

upstream mrsmith {
    server 127.0.0.1:8090;
}

server {
    listen 80;
    listen [::]:80;
    server_name rules.example.com;
    return 301 https://$host$request_uri;
}

server {
    server_name rules.example.com;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # uploads into the storage; keep in step with MRSMITH_MAX_UPLOAD_MB
    client_max_body_size 110m;
    server_tokens off;

    location / {
        proxy_pass http://mrsmith;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    ssl_certificate     /etc/letsencrypt/live/rules.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rules.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
}
