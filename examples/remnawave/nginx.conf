# Add to the nginx.conf of the Remnawave panel, next to its own server block.
# The "map $http_upgrade" and the "default_server ... ssl_reject_handshake"
# blocks are already there; do not repeat them.
# Issue a certificate for rules.example.com the same way as for the panel and
# mount it into the nginx container next to the panel's one.

upstream mrsmith {
    server mrsmith:8080;
}

server {
    server_name rules.example.com;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # uploads into the storage; keep in step with MRSMITH_MAX_UPLOAD_MB
    client_max_body_size 110m;

    location / {
        proxy_http_version 1.1;
        proxy_pass http://mrsmith;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SSL Configuration (Mozilla Intermediate Guidelines)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;

    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_certificate "/etc/nginx/ssl/rules_fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/rules_privkey.key";
    ssl_trusted_certificate "/etc/nginx/ssl/rules_fullchain.pem";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types application/json application/javascript application/yaml text/yaml text/css text/plain image/svg+xml;
}
